<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 310" width="980" height="310" role="img" aria-label="Pipeline: data, daily detector, hourly review, OpenTSLM reads the curve, analyst decides">
<style>
  .card { fill: #12161c; }
  .box { fill: #1a2028; stroke: #2c3540; stroke-width: 1; }
  .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ece9e2; }
  .n { font: 600 11px ui-monospace, "Cascadia Mono", Menlo, monospace; fill: #f0634b; letter-spacing: .08em; }
  .c { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8f98a3; }
  .m { font: 12px ui-monospace, "Cascadia Mono", Menlo, monospace; fill: #ece9e2; }
  .mk { font: 12px ui-monospace, "Cascadia Mono", Menlo, monospace; fill: #8f98a3; }
  .h { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ece9e2; }
  .hs { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8f98a3; }
  .axis { stroke: #2c3540; stroke-width: 1; }
  .load { fill: none; stroke: #ece9e2; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ref { fill: none; stroke: #6d7782; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .bar { fill: #4a535e; }
  .arrow { stroke: #3a4552; stroke-width: 1.5; }
  .dot { fill: #f0634b; }
  .pill { fill: none; stroke: #3a4552; stroke-width: 1; }

  .draw { stroke-dasharray: 260; animation: draw 10s infinite; }
  .draw2 { stroke-dasharray: 260; animation: draw2 10s infinite; }
  .flag { animation: flag 10s infinite; }
  .ztag { animation: ztag 10s infinite; }
  .band { fill: #f0634b; animation: band 10s infinite; }
  .l1 { animation: l1 10s infinite; } .l2 { animation: l2 10s infinite; }
  .l3 { animation: l3 10s infinite; } .l4 { animation: l4 10s infinite; }
  .go { animation: go 10s infinite; }
  .gotext { animation: gotext 10s infinite; }
  .d1 { animation: d1 10s infinite; } .d2 { animation: d2 10s infinite; }
  .d3 { animation: d3 10s infinite; } .d4 { animation: d4 10s infinite; }

  @keyframes draw  { 0% { stroke-dashoffset: 260; } 16%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 260; } }
  @keyframes draw2 { 0%, 46% { stroke-dashoffset: 260; } 58%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 260; } }
  @keyframes flag  { 0%, 28% { fill: #4a535e; } 31%, 94% { fill: #f0634b; } 100% { fill: #4a535e; } }
  @keyframes ztag  { 0%, 30% { opacity: 0; } 34%, 94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes band  { 0%, 56% { opacity: 0; } 60%, 94% { opacity: .22; } 100% { opacity: 0; } }
  @keyframes l1 { 0%, 66% { opacity: 0; } 68%, 94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes l2 { 0%, 69% { opacity: 0; } 71%, 94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes l3 { 0%, 72% { opacity: 0; } 74%, 94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes l4 { 0%, 75% { opacity: 0; } 77%, 94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes go { 0%, 86% { fill: transparent; stroke: #3a4552; } 89%, 94% { fill: #f0634b; stroke: #f0634b; } 100% { fill: transparent; stroke: #3a4552; } }
  @keyframes gotext { 0%, 86% { fill: #8f98a3; } 89%, 94% { fill: #12161c; } 100% { fill: #8f98a3; } }
  @keyframes d1 { 0%, 17% { transform: translateX(0); opacity: 0; } 18% { opacity: 1; } 24% { transform: translateX(34px); opacity: 1; } 25%, 100% { transform: translateX(34px); opacity: 0; } }
  @keyframes d2 { 0%, 36% { transform: translateX(0); opacity: 0; } 37% { opacity: 1; } 43% { transform: translateX(34px); opacity: 1; } 44%, 100% { transform: translateX(34px); opacity: 0; } }
  @keyframes d3 { 0%, 59% { transform: translateX(0); opacity: 0; } 60% { opacity: 1; } 65% { transform: translateX(34px); opacity: 1; } 66%, 100% { transform: translateX(34px); opacity: 0; } }
  @keyframes d4 { 0%, 78% { transform: translateX(0); opacity: 0; } 79% { opacity: 1; } 85% { transform: translateX(34px); opacity: 1; } 86%, 100% { transform: translateX(34px); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .draw, .draw2 { animation: none; stroke-dashoffset: 0; }
    .flag { animation: none; fill: #f0634b; }
    .band { animation: none; opacity: .22; }
    .ztag, .l1, .l2, .l3, .l4 { animation: none; opacity: 1; }
    .go { animation: none; fill: #f0634b; stroke: #f0634b; }
    .gotext { animation: none; fill: #12161c; }
    .d1, .d2, .d3, .d4 { animation: none; opacity: 0; }
  }
</style>

<rect class="card" width="980" height="310" rx="14"/>
<text class="h" x="22" y="32">From a curve to a decision</text>
<text class="hs" x="226" y="32">one flagged day, Saturday 10 January 2026</text>

<!-- 1 data -->
<rect class="box" x="20" y="50" width="156" height="236" rx="10"/>
<text class="n" x="34" y="74">01</text><text class="t" x="56" y="74">Data</text>
<line class="axis" x1="32" y1="192" x2="164" y2="192"/>
<path class="load draw" d="M32 162 L49.2 170 L66.4 154 L77.9 130 L95.1 122 L106.6 127.6 L123.8 126 L135.3 114 L146.8 122 L164 150"/>
<text class="c" x="34" y="230">Hourly Swiss load,</text>
<text class="c" x="34" y="246">weather, holidays</text>
<text class="c" x="34" y="262">2020 – 2026</text>

<!-- 2 detector -->
<rect class="box" x="216" y="50" width="156" height="236" rx="10"/>
<text class="n" x="230" y="74">02</text><text class="t" x="252" y="74">Detector</text>
<line class="axis" x1="228" y1="192" x2="360" y2="192"/>
<line class="ref" x1="228" y1="136" x2="360" y2="136"/>
<rect class="bar" x="234" y="136" width="12" height="56" rx="2"/>
<rect class="bar" x="252" y="134.4" width="12" height="57.6" rx="2"/>
<rect class="bar" x="270" y="136.8" width="12" height="55.2" rx="2"/>
<rect class="bar" x="288" y="135.2" width="12" height="56.8" rx="2"/>
<rect class="bar" x="306" y="136" width="12" height="56" rx="2"/>
<rect class="bar flag" x="324" y="112" width="12" height="80" rx="2"/>
<rect class="bar" x="342" y="140" width="12" height="52" rx="2"/>
<text class="m ztag" x="306" y="104" style="fill:#f0634b">z +3.8</text>
<text class="c" x="230" y="230">Daily baseline:</text>
<text class="c" x="230" y="246">weekday, weather,</text>
<text class="c" x="230" y="262">flag when |z| ≥ 3</text>

<!-- 3 hourly review -->
<rect class="box" x="412" y="50" width="156" height="236" rx="10"/>
<text class="n" x="426" y="74">03</text><text class="t" x="448" y="74">Hourly review</text>
<rect class="band" x="452.7" y="98" width="103.3" height="94"/>
<line class="axis" x1="424" y1="192" x2="556" y2="192"/>
<path class="ref" d="M424 162 L441.2 170 L458.4 154 L469.9 130 L487.1 122 L498.6 127.6 L515.8 126 L527.3 114 L538.8 122 L556 150"/>
<path class="load draw2" d="M424 162 L441.2 170 L458.4 144.4 L469.9 120.4 L487.1 112.4 L498.6 118 L515.8 116.4 L527.3 104.4 L538.8 112.4 L556 140.4"/>
<text class="c" x="426" y="230">24 hours against</text>
<text class="c" x="426" y="246">comparable earlier</text>
<text class="c" x="426" y="262">days, same weather</text>

<!-- 4 model -->
<rect class="box" x="608" y="50" width="156" height="236" rx="10"/>
<text class="n" x="622" y="74">04</text><text class="t" x="644" y="74">OpenTSLM</text>
<text class="mk l1" x="622" y="112">shape</text><text class="m l1" x="676" y="112">Saturday</text>
<text class="mk l2" x="622" y="136">hours</text><text class="m l2" x="676" y="136">05–24 h</text>
<text class="mk l3" x="622" y="160">gap</text><text class="m l3" x="676" y="160">+11.1 %</text>
<text class="mk l4" x="622" y="184">peak</text><text class="m l4" x="676" y="184">17 h</text>
<text class="c" x="622" y="230">Reads the curve and</text>
<text class="c" x="622" y="246">writes what changed,</text>
<text class="c" x="622" y="262">in numbers</text>

<!-- 5 analyst -->
<rect class="box" x="804" y="50" width="156" height="236" rx="10"/>
<text class="n" x="818" y="74">05</text><text class="t" x="840" y="74">Analyst</text>
<rect class="pill" x="818" y="106" width="128" height="30" rx="15"/>
<text class="c" x="882" y="125" text-anchor="middle">Close the alert</text>
<rect class="pill go" x="818" y="148" width="128" height="30" rx="15"/>
<text class="c gotext" x="882" y="167" text-anchor="middle" style="font-weight:600">Investigate 05–24 h</text>
<text class="c" x="818" y="230">Understands the gap,</text>
<text class="c" x="818" y="246">looks for leads to</text>
<text class="c" x="818" y="262">act on</text>

<!-- connectors -->
<g>
  <line class="arrow" x1="178" y1="168" x2="212" y2="168"/><path d="M206 163 L213 168 L206 173" fill="none" stroke="#3a4552" stroke-width="1.5"/>
  <line class="arrow" x1="374" y1="168" x2="408" y2="168"/><path d="M402 163 L409 168 L402 173" fill="none" stroke="#3a4552" stroke-width="1.5"/>
  <line class="arrow" x1="570" y1="168" x2="604" y2="168"/><path d="M598 163 L605 168 L598 173" fill="none" stroke="#3a4552" stroke-width="1.5"/>
  <line class="arrow" x1="766" y1="168" x2="800" y2="168"/><path d="M794 163 L801 168 L794 173" fill="none" stroke="#3a4552" stroke-width="1.5"/>
  <circle class="dot d1" cx="178" cy="168" r="4"/>
  <circle class="dot d2" cx="374" cy="168" r="4"/>
  <circle class="dot d3" cx="570" cy="168" r="4"/>
  <circle class="dot d4" cx="766" cy="168" r="4"/>
</g>
</svg>
