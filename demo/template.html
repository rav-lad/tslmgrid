<title>Swiss Load Alert Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a year-by-week grid on top; the picked week's curves below it; the picked day's review last. */
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --ink: #17202b;
  --muted: #5b6878;
  --rule: #d9dfe6;
  --load: #1f8a4c;
  --ref: #8a95a3;
  --hours-fill: rgba(214, 48, 49, 0.14);
  --hours: #d63031;
  --ok: #3f9a6b;
  --ok-bg: #e2f2e9;
  --warn: #d63031;
  --warn-bg: #fbe3e3;
  --unsure: #9aa6b4;
  --unsure-bg: #e7ebef;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --panel: #17202a; --ink: #e6ebf0; --muted: #9aa7b6; --rule: #2a3542;
    --load: #4fc483; --ref: #7d8896; --hours-fill: rgba(255, 107, 107, 0.16); --hours: #ff6b6b;
    --ok: #4fae7f; --ok-bg: #173527; --warn: #ff6b6b; --warn-bg: #3d1a1a; --unsure: #66737f; --unsure-bg: #253039;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --panel: #17202a; --ink: #e6ebf0; --muted: #9aa7b6; --rule: #2a3542;
  --load: #4fc483; --ref: #7d8896; --hours-fill: rgba(255, 107, 107, 0.16); --hours: #ff6b6b;
  --ok: #4fae7f; --ok-bg: #173527; --warn: #ff6b6b; --warn-bg: #3d1a1a; --unsure: #66737f; --unsure-bg: #253039;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 56px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--f-display); font-stretch: 85%; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; line-height: 1.05; }
h2 { font-size: 1.35rem; font-weight: 700; }
p { margin: 0; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.sub { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 0.8rem/1.3 var(--f-mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.sw.obs { border-color: var(--load); }
.sw.ref { border-color: var(--ref); border-top-style: dashed; }
.sw.hrs { height: 10px; border: 0; background: var(--hours-fill); outline: 1px solid var(--hours); }
.dot { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.chip { font: 600 0.78rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; padding: 7px 10px; border-radius: 999px; white-space: nowrap; }
.anomaly { --c: var(--warn); --c-bg: var(--warn-bg); }
.normal { --c: var(--ok); --c-bg: var(--ok-bg); }
.not_sure { --c: var(--unsure); --c-bg: var(--unsure-bg); }
.chip { color: var(--c); background: var(--c-bg); }
.dot { background: var(--c); }

/* Grid */
.grid-scroll { overflow-x: auto; }
.grid { display: grid; grid-template-columns: 44px repeat(53, minmax(10px, 1fr)); gap: 3px; min-width: 680px; align-items: center; }
.grid .yr { font: 0.75rem/1 var(--f-mono); color: var(--muted); }
.cell { aspect-ratio: 1; border: 0; padding: 0; border-radius: 2px; max-width: 100%; background: var(--c); cursor: pointer; }
.cell.empty { visibility: hidden; }
.cell:hover { outline: 2px solid var(--muted); outline-offset: 1px; }
.cell[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.cell:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Week and day */
.chart svg { width: 100%; height: auto; display: block; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.days button { font: 500 0.8rem/1.2 var(--f-mono); color: var(--ink); background: var(--c-bg); border: 1px solid transparent; border-radius: 6px; padding: 8px 4px; cursor: pointer; display: grid; gap: 2px; justify-items: center; min-width: 0; }
.days button small { color: var(--c); font-weight: 600; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; }
.days button[aria-pressed="true"] { border-color: var(--ink); }
.body { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 22px; }
@media (max-width: 760px) { .body { grid-template-columns: 1fr; } .days small { display: none; } }
.side { display: grid; gap: 16px; align-content: start; min-width: 0; }
dl.facts { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 0; font-size: 0.9rem; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.85rem; min-width: 0; overflow-wrap: anywhere; }
.tablebox { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font: 600 0.72rem/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.diff { color: var(--warn); }
.muted { color: var(--muted); }
.action { background: var(--bg); border-radius: 8px; padding: 12px 14px; display: grid; gap: 4px; }
.action p { max-width: 75ch; }
.action details { color: var(--muted); font-size: 0.88rem; }
.action summary { cursor: pointer; font: 500 0.78rem/1.4 var(--f-mono); color: var(--ink); width: fit-content; }
.action details p { margin-top: 8px; }
.eyebrow { font: 500 0.72rem/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
</style>

<div class="wrap">
  <h1>Swiss Load Alert Review</h1>
  <section class="panel" aria-labelledby="grid-title">
    <div class="head"><h2 id="grid-title">2020–2026, week by week</h2><div class="legend" id="grid-legend"></div></div>
    <div class="grid-scroll"><div class="grid" id="grid" role="group" aria-label="Weeks"></div></div>
  </section>
  <section class="panel" id="week" aria-live="polite"></section>
  <section class="panel" id="day" aria-live="polite"></section>
</div>

<script>
const DATA = /*DATA*/null;

const LABEL = { anomaly: "Anomaly", normal: "Normal", not_sure: "Not sure" };
const RANK = { anomaly: 3, not_sure: 2, normal: 1 };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (x, d = 1) => x == null ? "–" : (x > 0 ? "+" : "") + Number(x).toFixed(d);
const hh = h => String(h).padStart(2, "0") + ":00";
const byDate = new Map(DATA ? DATA.days.map(d => [d.date, d]) : []);
const state = { week: null, day: null };

function windows(hours) {
  const runs = [];
  [...hours].sort((a, b) => a - b).forEach(h => {
    if (runs.length && h === runs[runs.length - 1][1] + 1) runs[runs.length - 1][1] = h; else runs.push([h, h]);
  });
  return runs;
}
const winText = hours => hours.length ? windows(hours).map(([a, b]) => `${hh(a)}–${String(b).padStart(2, "0")}:59`).join(", ") : "none";

/** Line chart of load against the comparable-day reference. `load`/`ref` are flat hourly arrays (null = gap). */
function chart({ load, ref, shade, ticks, label, height = 260 }) {
  const W = 760, H = height, L = 56, R = 10, T = 12, B = 30, n = load.length;
  const vals = [...load, ...ref].filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.08 || 100; lo -= pad; hi += pad;
  const step = [100, 200, 250, 500, 1000, 2000].find(s => (hi - lo) / s <= 5) || 2000;
  const x = i => L + (i / (n - 1)) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const path = arr => { let d = "", on = false; arr.forEach((v, i) => { if (v == null) { on = false; return; } d += `${on ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; on = true; }); return d; };
  let g = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" fill="var(--muted)" font-size="11" font-family="var(--f-mono)">${v.toLocaleString("en-US")}</text>`;
  }
  const colW = (W - L - R) / (n - 1);
  windows(shade).forEach(([s, e]) => {
    const x0 = Math.max(L, x(s) - colW / 2), x1 = Math.min(W - R, x(e) + colW / 2);
    g += `<rect x="${x0}" y="${T}" width="${x1 - x0}" height="${H - T - B}" fill="var(--hours-fill)" stroke="var(--hours)"/>`;
  });
  ticks.forEach(([i, text, sep]) => {
    if (sep) g += `<line x1="${x(i) - colW / 2}" x2="${x(i) - colW / 2}" y1="${T}" y2="${H - B}" stroke="var(--rule)"/>`;
    g += `<text x="${x(i) + (sep ? colW * 11.5 : 0)}" y="${H - 10}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="var(--f-mono)">${text}</text>`;
  });
  g += `<path d="${path(ref)}" fill="none" stroke="var(--ref)" stroke-width="2" stroke-dasharray="7 5"/>`;
  g += `<path d="${path(load)}" fill="none" stroke="var(--load)" stroke-width="2.2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}

const legend = shade => `<div class="legend"><span><i class="sw obs"></i>load (MW)</span><span><i class="sw ref"></i>comparable days</span>${shade ? '<span><i class="sw hrs"></i>anomaly hours</span>' : ""}</div>`;

function isoWeekDays(year, week) {
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const monday = new Date(jan4); monday.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + (week - 1) * 7);
  return [...Array(7)].map((_, i) => { const d = new Date(monday); d.setUTCDate(monday.getUTCDate() + i); return d.toISOString().slice(0, 10); });
}

function weekStatus(dates) {
  return dates.map(d => byDate.get(d)).filter(Boolean).reduce((s, d) => (RANK[d.status] > RANK[s] ? d.status : s), "normal");
}

function buildGrid() {
  const [lastYear, lastWeek] = DATA.last_week;
  let html = "";
  for (let y = DATA.first_year; y <= lastYear; y++) {
    html += `<div class="yr">${y}</div>`;
    for (let w = 1; w <= 53; w++) {
      const dates = isoWeekDays(y, w);
      const has = w <= DATA.weeks_in_year[y] && !(y === lastYear && w > lastWeek) && dates.some(d => byDate.has(d));
      if (!has) { html += `<span class="cell empty" aria-hidden="true"></span>`; continue; }
      const s = weekStatus(dates);
      const label = `Week ${w} ${y}, from ${dates[0]}: ${LABEL[s]}`;
      html += `<button type="button" class="cell ${s}" data-key="${y}-${w}" title="${label}" aria-label="${label}"></button>`;
    }
  }
  const grid = document.getElementById("grid");
  grid.innerHTML = html;
  grid.querySelectorAll(".cell[data-key]").forEach(c => c.addEventListener("click", () => {
    const [y, w] = c.dataset.key.split("-").map(Number);
    const dates = isoWeekDays(y, w).filter(d => byDate.has(d));
    const pick = dates.find(d => byDate.get(d).status !== "normal") || dates[0];
    showWeek(y, w, pick);
  }));
  document.getElementById("grid-legend").innerHTML = Object.keys(LABEL).map(s => `<span class="${s}"><i class="dot"></i>${LABEL[s]}</span>`).join("");
}

function showWeek(year, week, pick) {
  state.week = [year, week];
  document.querySelectorAll(".cell[data-key]").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.key === `${year}-${week}`)));
  const dates = isoWeekDays(year, week);
  const load = [], ref = [], shade = [], ticks = [];
  dates.forEach((d, i) => {
    const day = byDate.get(d);
    for (let h = 0; h < 24; h++) {
      load.push(day ? day.load[h] : null);
      ref.push(day && day.ref ? day.ref[h] : null);
    }
    if (day && day.status === "anomaly") day.hours.forEach(h => shade.push(i * 24 + h));
    ticks.push([i * 24, new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", timeZone: "UTC" }), i > 0]);
  });
  const fmtD = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" });
  document.getElementById("week").innerHTML = `
    <div class="head"><h2>Week ${week}, ${fmtD(dates[0])} – ${fmtD(dates[6])} ${dates[6].slice(0, 4)}</h2><span class="chip ${weekStatus(dates)}">${LABEL[weekStatus(dates)]}</span></div>
    <div class="chart">${chart({ load, ref, shade, ticks, label: `Hourly load of week ${week} ${year} against comparable days`, height: 230 })}${legend(shade.length)}</div>
    <div class="days" role="group" aria-label="Days of the week">${dates.map(d => {
      const day = byDate.get(d);
      if (!day) return `<span></span>`;
      const name = new Date(d + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", timeZone: "UTC" });
      return `<button type="button" class="${day.status}" data-date="${d}" aria-pressed="false">${name}<small>${LABEL[day.status]}</small></button>`;
    }).join("")}</div>`;
  document.querySelectorAll("#week .days button").forEach(b => b.addEventListener("click", () => showDay(b.dataset.date)));
  showDay(pick);
}

function showDay(date) {
  state.day = date;
  document.querySelectorAll("#week .days button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.date === date)));
  const d = byDate.get(date);
  const shade = d.status === "anomaly" ? d.hours : [];
  const facts = [
    ["Special day", d.special || "No"],
    ["Vs daily baseline", `${fmt(d.rel_dev_pct)}%`],
    ["Vs comparable days", d.residual == null ? "–" : `${fmt(d.residual)}%`],
    ["Comparable days", String(d.n_comparable)],
    ["Temperature", `${d.temp_c.toFixed(1)} °C (normal ${d.temp_normal_c.toFixed(1)})`],
  ];
  const ticks = [0, 6, 12, 18, 23].map(h => [h, hh(h), false]);
  document.getElementById("day").innerHTML = `
    <div class="head"><div><h2>${esc(d.title)}</h2><p class="sub">${esc(d.subtitle)}</p></div><span class="chip ${d.status}">${LABEL[d.status]}</span></div>
    <div class="body">
      <div class="chart">${chart({ load: d.load, ref: d.ref || d.load.map(() => null), shade, ticks, label: `Hourly load on ${date} against comparable days` })}${legend(shade.length)}</div>
      <div class="side">
        <dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      </div>
    </div>
    ${modelPanel(d)}`;
}

function modelPanel(d) {
  const t = d.model_text;
  if (!t) return `<div class="action"><span class="eyebrow">Model</span><p class="muted">The model has not reviewed this day (it runs on 2025–2026).</p></div>`;
  const cut = t.lastIndexOf("Answer:");
  const text = (cut >= 0 ? t.slice(0, cut) : t).trim();
  const question = d.prompt ? `<details><summary>Question asked to the model</summary><p>${esc(d.prompt)}</p></details>` : "";
  return `<div class="action"><span class="eyebrow">Model${DATA.model_name ? " · " + esc(DATA.model_name) : ""}</span><p>${esc(text)}</p>${question}</div>`;
}

if (DATA) {
  buildGrid();
  const s = byDate.get(DATA.start);
  showWeek(s.year, s.week, DATA.start);
}
</script>
