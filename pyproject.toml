[project]
name = "swissgrid-anomalies"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.108",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
sgcot-download = "swissgrid_cot.download:main"
sgcot-ingest = "swissgrid_cot.ingest.build:main"
sgcot-ingest-holdout = "swissgrid_cot.ingest.holdout:main"
sgcot-annotate = "swissgrid_cot.annotate.build:main"
sgcot-export = "swissgrid_cot.train.export:main"
sgcot-review = "swissgrid_cot.review.build:main"
sgcot-review-export = "swissgrid_cot.review.export:main"
sgcot-review-score = "swissgrid_cot.review.score:main"
sgcot-explain-export = "swissgrid_cot.explain.export:main"
sgcot-explain-score = "swissgrid_cot.explain.score:main"
sgcot-explain-fidelity = "swissgrid_cot.explain.fidelity:main"
sgcot-baselines = "swissgrid_cot.eval.baselines:main"
sgcot-score = "swissgrid_cot.eval.score:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "swissgrid_cot"
